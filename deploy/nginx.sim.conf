worker_processes 1;

events {
    # 1000 proxied WS through one worker = ~2000 sockets (client + upstream)
    # + margin. Stock deploy/nginx.conf is 1024 — fine for prod (Cloud Run
    # spreads it), not enough for this single-box 1000-CCU simulation.
    worker_connections 4096;
}

http {
    # WebSocket upgrade support (the game speaks WS for everything).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robin across the two stateless backend instances. Because all
    # room state lives in Redis (not in the pod), it does NOT matter which
    # backend a connection lands on.
    upstream poker_backends {
        server backend-1:8080;
        server backend-2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://poker_backends;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
