name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
        # Cloud Run injects $PORT; keep CI env free of it so the default-port
        # path is the one under test (resolve_port precedence is unit-tested).
        env:
          PORT: ""

  build-and-deploy:
    name: docker build + Cloud Run deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Keyless auth: GitHub OIDC -> WIF -> SA impersonation. The WIF
      # principal has roles/iam.serviceAccountTokenCreator on the SA
      # resource (principalSet, colon-form subject), and the SA holds
      # run.admin / artifactregistry.writer / logging.logWriter.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/153176493081/locations/global/workloadIdentityPools/pocerbanting/providers/github
          service_account: pocerbanting-ci@clear-region-377216.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image to Artifact Registry
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/clear-region-377216/poker-banting/pocer-server:${GITHUB_SHA}
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (asia-southeast1)
        run: |
          # Scaling contract (see poker-banting-server/docs/CAPACITY.md):
          #   --concurrency 1000 : WS connections are long-lived (1 WS = 1
          #                        in-flight request); Cloud Run hard caps
          #                        this at 1000/instance. Default 80 would
          #                        cap the server at 80 CCU.
          #   --timeout 3600     : a WS connection = 1 request; 300s would kill
          #                        every game longer than 5 minutes.
          #   --max 3            : 3 x 1000 = 3000 CCU ceiling. Multi-pod is
          #                        safe now (Opsi B: Redis + pub/sub +
          #                        stateless room driver). PITFALL: the long
          #                        flag `--max-instances` is SILENTLY IGNORED
          #                        by gcloud (verified 568.0.0) — only the
          #                        short `--max` persists.
          #   --cpu 0.5 --memory 512Mi : 512Mi is the Cloud Run minimum memory;
          #                        0.5 vCPU verified enough (1000 active =
          #                        ~20% CPU on 1 vCPU; RAM ~80% at 2500).
          # ENV STORAGE/REDIS_URL: NOT set here on purpose — they live in the
          # service config, set manually via:
          #   gcloud run services update poker-banting \
          #     --region asia-southeast1 \
          #     --update-env STORAGE=redis,REDIS_URL=rediss://...
          # (a plain deploy without --update-env/--clear-env preserves them).
          gcloud run deploy poker-banting \
            --image "asia-southeast1-docker.pkg.dev/clear-region-377216/poker-banting/pocer-server:${GITHUB_SHA}" \
            --region asia-southeast1 \
            --project clear-region-377216 \
            --platform managed \
            --allow-unauthenticated \
            --concurrency 1000 \
            --timeout 3600s \
            --cpu 0.5 \
            --memory 512Mi \
            --max 3
          echo "Service URL: https://$(gcloud run services describe poker-banting \
            --region asia-southeast1 --project clear-region-377216 \
            --format='value(status.url)')'
