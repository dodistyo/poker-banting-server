name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
        # Cloud Run injects $PORT; keep CI env free of it so the default-port
        # path is the one under test (resolve_port precedence is unit-tested).
        env:
          PORT: ""

  build-and-deploy:
    name: docker build + Cloud Run deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Keyless auth: GitHub OIDC -> WIF. NO `service_account` set on purpose:
      # the WIF principal itself holds run.admin / artifactregistry.writer /
      # logging.logWriter at project level, so acting as the WIF identity
      # DIRECTLY avoids an SA-impersonation hop (which would additionally
      # require iam.serviceAccountTokenCreator on the SA resource).
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/153176493081/locations/global/workloadIdentityPools/pocerbanting/providers/github
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image to Artifact Registry
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/clear-region-377216/poker-banting/pocer-server:${GITHUB_SHA}
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (asia-southeast1)
        run: |
          gcloud run deploy poker-banting \
            --image "asia-southeast1-docker.pkg.dev/clear-region-377216/poker-banting/pocer-server:${GITHUB_SHA}" \
            --region asia-southeast1 \
            --project clear-region-377216 \
            --platform managed \
            --allow-unauthenticated \
            --max-instances 1 \
            --timeout 300s
          echo "Service URL: https://$(gcloud run services describe poker-banting \
            --region asia-southeast1 --project clear-region-377216 \
            --format='value(status.url)')"
