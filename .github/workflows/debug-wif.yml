name: debug-wif
# TEMPORARY: decodes the actual WIF principal subject claim so the IAM
# subject bindings can be pinned exactly. DELETE once CI deploys are green.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode WIF principal subject
        env:
          OIDC: ${{ github.token }}
        run: python3 scripts/debug_wif.py
