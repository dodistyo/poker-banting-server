name: debug-wif
# TEMPORARY — DELETE: triggers on push (same event as CI, so the OIDC token
# carries the real sub claim) and decodes the minted WIF principal JWT to
# reveal the exact subject for the IAM tokenCreator binding.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode minted WIF principal subject
        env:
          GHA_ID_TOKEN: ${{ github.token }}
        run: python3 scripts/debug_wif.py
