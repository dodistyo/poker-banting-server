[package]
name = "pocer-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-ws = "0.2"
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
dotenv = "0.15"
